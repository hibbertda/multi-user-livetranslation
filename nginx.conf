server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers applied to all responses.
    # HSTS is intentionally omitted: this container serves plain HTTP behind
    # Azure Container Apps' TLS-terminating ingress, which sets its own
    # Strict-Transport-Security header. Adding HSTS at this internal hop
    # would be ineffective (browsers ignore it over HTTP) and misleading.
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(self), geolocation=(), payment=()" always;
    # CSP: runtime config is now a same-origin external script, so no
    # 'unsafe-inline' needed for script-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.cognitiveservices.azure.com https://*.tts.speech.microsoft.com wss://*.webpubsub.azure.com https://login.microsoftonline.com https://*.blob.core.windows.net; font-src 'self'; img-src 'self' data:; frame-ancestors 'none';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config must never be cached — it changes per deployment.
    location = /runtime-config.js {
        add_header Cache-Control         "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.cognitiveservices.azure.com https://*.tts.speech.microsoft.com wss://*.webpubsub.azure.com https://login.microsoftonline.com https://*.blob.core.windows.net; font-src 'self'; img-src 'self' data:; frame-ancestors 'none';" always;
    }

    # Static assets: nginx add_header in a child block replaces (not
    # extends) the parent's headers, so we must repeat security headers.
    location ~* \.(?:css|js|map|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control          "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.cognitiveservices.azure.com https://*.tts.speech.microsoft.com wss://*.webpubsub.azure.com https://login.microsoftonline.com https://*.blob.core.windows.net; font-src 'self'; img-src 'self' data:; frame-ancestors 'none';" always;
    }
}
